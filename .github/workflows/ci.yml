name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint and typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck API
        run: npm run typecheck:api

      - name: Test
        run: npm test

  database:
    name: Migrations and SQL guards
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fetch main for migration comparison
        run: git fetch --no-tags --depth=1 origin main

      - name: Lint migrations
        run: node scripts/lint-migrations.mjs origin/main

      # Migrations only, no seeds: proves production can start from the schema alone.
      - name: Apply migrations and run SQL guards
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
        run: bash scripts/test-migrations.sh

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The runtime client throws when these are missing, but `vite build` never
      # evaluates it — so without this check CI goes green while shipping a
      # bundle that fails on first load in the browser.
      - name: Check the Supabase build config is present
        run: |
          missing=()
          [ -n "$VITE_SUPABASE_URL" ] || missing+=(VITE_SUPABASE_URL)
          [ -n "$VITE_SUPABASE_ANON_KEY" ] || missing+=(VITE_SUPABASE_ANON_KEY)
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}."
            echo "::error::CI would otherwise build a bundle that throws on load."
            echo "::error::Set them to the STAGING project's values (Settings, Secrets and variables, Actions)."
            exit 1
          fi

      - name: Build
        run: npm run build
