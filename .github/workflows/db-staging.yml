name: Database - staging

# Applies pending migrations to the STAGING Supabase project whenever a pull
# request changes supabase/migrations, so the Vercel preview (which reads
# staging) has the schema its code expects. Never touches production.
# Uses the Supabase Management API: no database password is stored in GitHub.
on:
  pull_request:
    branches: [main]
    paths: ['supabase/migrations/**']
  workflow_dispatch:

concurrency:
  group: db-staging
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply migrations to staging
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      STAGING_PROJECT_REF: ${{ vars.STAGING_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check configuration
        id: config
        run: |
          if [ "$STAGING_PROJECT_REF" = "fdnfdscpefxqvtggbbbr" ]; then echo "STAGING_PROJECT_REF is production"; exit 1; fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$STAGING_PROJECT_REF" ]; then
            echo "::warning::Staging not migrated: set the SUPABASE_ACCESS_TOKEN secret and STAGING_PROJECT_REF variable (docs/environments.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply
        if: steps.config.outputs.ready == 'true'
        run: node scripts/db/migrate.mjs --project-ref "$STAGING_PROJECT_REF"
