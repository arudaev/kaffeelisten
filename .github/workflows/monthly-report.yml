name: Monthly Report (manual trigger)

on:
  # Manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "send" to confirm triggering the monthly report and database reset'
        required: true
        type: string

jobs:
  send-report:
    name: Trigger monthly report
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'send'

    steps:
      # Without this the curl below is built from empty strings and fails with an
      # opaque "URL rejected", which is a bad thing to debug at a month end.
      - name: Check the trigger is configured
        env:
          VERCEL_APP_URL: ${{ secrets.VERCEL_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          missing=()
          [ -n "$VERCEL_APP_URL" ] || missing+=(VERCEL_APP_URL)
          [ -n "$CRON_SECRET" ] || missing+=(CRON_SECRET)
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}."
            echo "::error::These are set when production goes live, and must match the values"
            echo "::error::deployed to the Vercel project — a mismatch is rejected by the API."
            exit 1
          fi

      - name: Trigger report API
        run: |
          curl -X POST "${{ secrets.VERCEL_APP_URL }}/api/cron/monthly-report" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --fail \
            --silent \
            --show-error

      - name: Report success
        run: echo "Monthly report triggered successfully."
