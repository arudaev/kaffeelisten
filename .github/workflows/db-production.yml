name: Database - production

# The ONLY way migrations reach production. Runs automatically when a merge to
# main changes supabase/migrations, at the same time as Vercel builds main.
# Every migration in a release must be tagged "deploy: pre" (backwards-compatible),
# which CI enforces, so it does not matter which of the two finishes first.
# Post-deploy migrations ship in their own later PR. Procedure: docs/environments.md.
on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
  workflow_dispatch:

concurrency:
  group: db-production
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply migrations to production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PRODUCTION_PROJECT_REF: fdnfdscpefxqvtggbbbr
      STAGING_PROJECT_REF: ${{ vars.STAGING_PROJECT_REF || secrets.STAGING_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Plan
        run: node scripts/db/migrate.mjs --project-ref "$PRODUCTION_PROJECT_REF" --dry-run

      - name: Apply
        run: node scripts/db/migrate.mjs --project-ref "$PRODUCTION_PROJECT_REF" --production

      # Informational: staging may be ahead when another PR's migrations are open.
      - name: Compare schema with staging
        if: env.STAGING_PROJECT_REF != ''
        continue-on-error: true
        run: node scripts/db/drift.mjs --a "$STAGING_PROJECT_REF" --b "$PRODUCTION_PROJECT_REF"
