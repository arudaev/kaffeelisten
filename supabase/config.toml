# Supabase CLI config for the Kaffeelisten project.
#
# `project_id` is a LOCAL slug for the CLI's Docker containers — it is NOT the
# remote project ref. The linked remote ref (fdnfdscpefxqvtggbbbr) lives in
# supabase/.temp/project-ref after `supabase link` and is intentionally untracked.
#
# The values below are aligned to the linked remote project (Postgres 17, the
# dashboard-configured auth settings) so `supabase link` no longer reports
# "Local config differs from linked project". Applying migrations with
# `supabase db push` does not depend on this file, but keeping it in sync keeps
# the CLI quiet and makes `supabase start` reproduce production locally.
project_id = "kaffeelisten"

[api]
enabled = true
port = 54421
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54422
shadow_port = 54420
# Matches the hosted projects, both Postgres 17. Local was pinned to 15 while
# the CLI was v2.19.5, which rejected 17 at config-parse time; CLI v3 accepts
# it. Keep this equal to the remote: a migration proved on 15 has not been
# proved for 17, and that is the whole value of testing locally first.
major_version = 17

[db.pooler]
enabled = false
port = 54429
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54423
api_url = "http://127.0.0.1"

# Renamed from [inbucket] by CLI v3. Same mail catcher: every outgoing email
# lands here and nothing leaves the machine, which is what lets the whole
# month-end run be exercised without sending anything.
[local_smtp]
enabled = true
port = 54424

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 6

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

[auth.email]
enabled = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600

[auth.email.template]

[auth.sms]
enabled = false
enable_confirmations = false
template = "Your code is {{ .Code }}"
max_frequency = "5s"

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[analytics]
# Off locally: the Logflare/vector pair needs the Docker daemon exposed on
# tcp://localhost:2375, which Docker Desktop does not do by default, and a
# vector container left behind by a failed start then blocks the next one.
# Nothing in the app reads local analytics. Hosted projects are unaffected.
enabled = false
port = 54427
backend = "postgres"
