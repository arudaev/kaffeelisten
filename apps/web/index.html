<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#D97706" />
    <meta name="description" content="Kaffee- und Snack-Verbrauch am Campus digital erfassen" />
    <title>Kaffeelisten</title>
    <script>
      // Anti-FOUC: apply the stored theme mode AND the cached brand-palette accent
      // before first paint, so a new page never flashes the default palette.
      (function () {
        try {
          var m = localStorage.getItem('kaffeelisten-theme-mode') || 'system';
          var dark = m === 'dark' || (m === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var mode = dark ? 'dark' : 'light';
          var root = document.documentElement;
          root.dataset.mode = mode;
          var raw = localStorage.getItem('kaffeelisten-theme-vars');
          if (raw) {
            var vars = JSON.parse(raw)[mode] || {};
            for (var k in vars) root.style.setProperty(k, vars[k]);
          }
        } catch (e) {
          document.documentElement.dataset.mode = 'light';
        }
      })();
    </script>
    <!-- Link previews. The image lives in kaffeelisten/.github (brand/assets) so every
         deployment shares one copy; og:url is left out because each host is its own. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kaffeelisten" />
    <meta property="og:title" content="Kaffeelisten" />
    <meta property="og:description" content="Die Kaffeeliste – ohne Papier." />
    <meta property="og:locale" content="de_DE" />
    <meta property="og:image" content="https://raw.githubusercontent.com/kaffeelisten/.github/main/brand/assets/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Kaffeelisten: der gemeinsame Tisch um elf Uhr, Tassen und das Tablet, das die Kaffeeliste ersetzt." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kaffeelisten" />
    <meta name="twitter:description" content="Die Kaffeeliste – ohne Papier." />
    <meta name="twitter:image" content="https://raw.githubusercontent.com/kaffeelisten/.github/main/brand/assets/og.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
